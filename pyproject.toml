[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deskwidgets"
dynamic = ["version"]
description = "macOS-style desktop widgets for Linux and Windows, drawn with Cairo from Lua"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DeskWidgets contributors" }]
keywords = ["widgets", "desktop", "cairo", "lua", "linux", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = [
    "pycairo>=1.20",
    "lupa>=2.0",
    "psutil>=5.8",
    "Pillow>=9.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# the "Now playing" widget on Windows reads the system media controls through this
windows-media = ["winsdk; sys_platform == 'win32'"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/T0ks1k24/DeskWidgets"
Issues = "https://github.com/T0ks1k24/DeskWidgets/issues"

[project.scripts]
deskwidgets = "deskwidgets.cli:main"

[tool.setuptools.dynamic]
version = { attr = "deskwidgets.VERSION" }

[tool.setuptools.packages.find]
include = ["deskwidgets*"]

[tool.setuptools.package-data]
deskwidgets = ["widgets/**/*", "assets/**/*", "engine/lua/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]

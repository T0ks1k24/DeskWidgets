name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 nodejs fakeroot

      - name: Check
        run: make check

      - name: Build .deb
        run: make deb

      - uses: actions/upload-artifact@v4
        with:
          name: deskwidgets-deb
          path: dist/*.deb

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true

--[[ conky config shared by every DeskWidgets widget. The service starts one conky per
     widget instance and passes its id, type, size, style, position and refresh interval
     in the environment (MAC_*). Don't start it by hand, use `deskwidgets`. ]]

local env = os.getenv
local id = env('MAC_ID') or 'widget'
local preview = env('MAC_PREVIEW') ~= nil
local w = tonumber(env('MAC_W')) or 202
local h = tonumber(env('MAC_H')) or 202

conky.config = {
    out_to_x = not preview,
    out_to_console = preview,
    total_run_times = preview and 10 or 0,

    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    own_window_title = 'deskwidget:' .. id,
    own_window_class = 'DeskWidget',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = true,

    alignment = 'top_left',
    gap_x = tonumber(env('MAC_X')) or 0,
    gap_y = tonumber(env('MAC_Y')) or 0,
    minimum_width = w,
    maximum_width = w,
    minimum_height = h,
    border_inner_margin = 0,
    border_outer_margin = 0,
    border_width = 0,
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,

    update_interval = tonumber(env('MAC_INTERVAL')) or 1,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    top_name_width = 22,

    use_xft = true,
    font = 'DW Regular:size=8',

    lua_load = env('MAC_ENGINE') .. '/main.lua',
    lua_draw_hook_pre = 'main',
    lua_mouse_hook = 'conky_mouse',   -- conky 1.19 does not add the conky_ prefix here
}

conky.text = [[]]
